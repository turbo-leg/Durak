name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Find unused files, exports and dependencies
        run: npm run knip

      - name: Typecheck all workspaces (including client references and server tests)
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and validate all workspaces
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    # A hung step must fail (and roll back), not sit until GitHub cancels it hours later.
    timeout-minutes: 25
    # One production deploy at a time; a newer push waits rather than racing a rollback.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: durak-discord-activity
      APP_URL: https://durak-discord-activity.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Remember the last good release
        id: previous
        run: |
          image=$(flyctl releases -a "$FLY_APP" --image --json | jq -r '[.[] | select(.Status == "complete")][0].ImageRef // empty')
          echo "Last good image: ${image:-none}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Only require the database after the deploy if it was up before it; a database
          # outage must not block shipping a code fix.
          if curl -sf --max-time 15 "$APP_URL/ready" | grep -q '"databaseReady":true'; then
            echo "smoke_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Database was not ready before this deploy; smoke test accepts degraded mode"
            echo "smoke_flags=--allow-degraded" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        run: flyctl deploy --remote-only

      - name: Smoke test the live site
        timeout-minutes: 6
        run: node scripts/smoke.mjs "$APP_URL" ${{ steps.previous.outputs.smoke_flags }}

      - name: Roll back to the last good release
        if: failure() && steps.previous.outputs.image != ''
        timeout-minutes: 10
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          # A deploy that failed before releasing (build or registry error) left the old
          # release serving; restarting it would only drop live games.
          latest=$(flyctl releases -a "$FLY_APP" --image --json | jq -r '.[0].ImageRef // empty')
          if [ "$latest" = "$PREVIOUS_IMAGE" ]; then
            echo "No new release went out; nothing to roll back."
            exit 0
          fi
          echo "::error::Deploy or smoke test failed; rolling back to $PREVIOUS_IMAGE"
          flyctl deploy --image "$PREVIOUS_IMAGE" --strategy immediate
          node scripts/smoke.mjs "$APP_URL" --allow-degraded
