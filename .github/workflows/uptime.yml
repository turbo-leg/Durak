name: Uptime

# Every 10 minutes, check the live site. When it is down or degraded, open (or update) one
# "Production down" issue, which emails and pushes a notification. Close it on recovery.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check (default: production)'
        required: false

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: ${{ inputs.url || 'https://durak-discord-activity.fly.dev' }}
      TITLE: 'Production down'
    steps:
      - name: Check /ready
        id: probe
        run: |
          status=down
          body='no response'
          # Three tries over about a minute, so one slow cold start does not page anyone.
          for i in 1 2 3; do
            body=$(curl -s --max-time 20 -w ' (HTTP %{http_code})' "$URL/ready" || true)
            if echo "$body" | grep -q '"ready":true' && echo "$body" | grep -q '"databaseReady":true'; then
              status=up; break
            fi
            sleep 20
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          { echo 'body<<EOF'; echo "$body"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          echo "$URL is $status: $body"

      - name: Open or update the incident
        if: steps.probe.outputs.status == 'down'
        run: |
          note="$(date -u +'%Y-%m-%d %H:%M UTC'): \`$URL/ready\` returned: ${{ steps.probe.outputs.body }}"
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Still down. $note"
          else
            gh issue create --title "$TITLE" --assignee "${{ github.repository_owner }}" \
              --body "$note

          Runbook: docs/OPERATIONS.md (Outages). \`fly logs -a durak-discord-activity\` shows why."
          fi

      - name: Close the incident on recovery
        if: steps.probe.outputs.status == 'up'
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Recovered at $(date -u +'%Y-%m-%d %H:%M UTC')."
          fi
