# The production image with its services, locally: `docker compose up --build`.
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '2567:2567'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=2567
      - REDIS_URL=redis://redis:6379
      # The compose database unless .env names another.
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/durak}
      - RESULT_OUTBOX_DIR=/data/results
    volumes:
      - result-outbox:/data
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    stop_grace_period: 45s

volumes:
  mongo-data:
  result-outbox:
