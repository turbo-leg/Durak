app = "durak-discord-activity"
primary_region = "iad"

[deploy]
  kill_timeout = "35s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one machine awake: a stopped machine made the first visitor wait about 9 s.
  min_machines_running = 1
  processes = ["app"]
  sticky_sessions = true

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
