app = "durak-discord-activity"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 45

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a throwaway machine first: an unreachable database stops the deploy
  # and the current release keeps serving. SKIP_DB_CHECK=1 overrides it in an emergency.
  release_command = "node scripts/check-db.mjs"

[env]
  PORT = "2567"
  RESULT_OUTBOX_DIR = "/data/results"

[mounts]
  source = "durak_results"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one machine awake: a stopped machine made the first visitor wait about 9 s.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 120
    hard_limit = 150

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "15s"
    method = "GET"
    path = "/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
