<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #182b3c;
        color: #e9e4da;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 10px 16px;
        background: #10202d;
      }
      #stage {
        min-height: 0;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Development only: not part of the production build. -->
    <div id="controls"></div>
    <div id="stage"></div>
    <script type="module" src="/src/character/preview.ts"></script>
  </body>
</html>
